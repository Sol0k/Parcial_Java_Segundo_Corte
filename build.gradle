plugins { id 'java'; id 'war' }
group='co.edu.uts'; version='1.0.0'
java { toolchain { languageVersion=JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies { compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'; compileOnly 'jakarta.servlet.jsp:jakarta.servlet.jsp-api:3.1.1'; implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.2'; implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'; implementation 'org.mindrot:jbcrypt:0.4'; runtimeOnly 'com.mysql:mysql-connector-j:9.0.0' }
war { archiveFileName='app.war' }