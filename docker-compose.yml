services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: trabajos_grado
      MYSQL_USER: uts
      MYSQL_PASSWORD: uts
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql", "./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql"]
  app:
    build: .
    depends_on: [db]
    environment:
      DB_URL: jdbc:mysql://db:3306/trabajos_grado?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: uts
      DB_PASSWORD: uts
    ports: ["8080:8080"]
volumes:
  mysql_data: